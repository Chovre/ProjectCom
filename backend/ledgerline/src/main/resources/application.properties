# ===================================================================
# LedgerLine Application Configuration
# ===================================================================

# --- Datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL:${DIRECT_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres.iomrthtuopdlkxxruddj}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:MahaDev#2412}}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
jwt.secret=${JWT_SECRET:ledgerline-super-secret-key-for-jwt-token-generation-minimum-256-bits-long}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# --- Server ---
server.port=${PORT:8081}

# --- SpringDoc / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.onrender.com}}
