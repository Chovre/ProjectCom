# ===================================================================
# LedgerLine Application Configuration
# ===================================================================

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
jwt.secret=${JWT_SECRET:ledgerline-super-secret-key-for-jwt-token-generation-minimum-256-bits-long}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# --- Server ---
server.port=8081

# --- SpringDoc / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173
