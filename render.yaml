services:
  # =========================================================================
  # 1. Spring Boot Backend Web Service (Docker Runtime)
  # =========================================================================
  - type: web
    name: ledgerline-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/ledgerline/Dockerfile
    dockerContext: ./backend/ledgerline
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://ledgerline-frontend.onrender.com,http://localhost:5173

  # =========================================================================
  # 2. React Vite Frontend Static Site
  # =========================================================================
  - type: web
    name: ledgerline-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ledgerline-backend
          envVarKey: RENDER_EXTERNAL_URL

# =========================================================================
# 3. PostgreSQL Database
# =========================================================================
databases:
  - name: ledgerline-db
    plan: free
    region: oregon
    databaseName: ledgerline_db
    user: ledgerline_user
