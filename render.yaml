services:
  # =========================================================================
  # 1. Spring Boot Backend Web Service (Docker Runtime)
  # =========================================================================
  - type: web
    name: ledgerline-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/ledgerline/Dockerfile
    dockerContext: ./backend/ledgerline
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173

  # =========================================================================
  # 2. React Vite Frontend Static Site
  # =========================================================================
  - type: web
    name: ledgerline-frontend
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ledgerline-backend
          envVarKey: RENDER_EXTERNAL_URL
